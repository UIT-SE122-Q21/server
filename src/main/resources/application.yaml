spring:
  application:
    name: server
  datasource:
    # Thêm tham số currentSchema và quan trọng nhất là gán múi giờ trực tiếp vào URL
    url: jdbc:postgresql://localhost:5432/postgres?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: postgres
    password: 1Uch@mch0td@!
    driver-class-name: org.postgresql.Driver
  # Cấu hình Jackson để ResponseWrapperAdvice format thời gian đúng chuẩn
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true
        # Đảm bảo Hibernate gửi đúng múi giờ cho PostgreSQL
        jdbc.time_zone: Asia/Ho_Chi_Minh
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  use-fqn: true